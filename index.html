<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grid Calc">
<title>Grid Calc</title>
<style>
  body{font-family:-apple-system,sans-serif;margin:0;padding:12px;background:#f4f5f7;color:#222}
  h2{font-size:17px;margin:4px 0 10px}
  .card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .full{grid-column:1/3}
  .sec{grid-column:1/3;font-size:13px;font-weight:bold;color:#0a7cff;margin-top:6px;border-top:1px solid #eee;padding-top:8px}
  label{font-size:12px;color:#666;display:block;margin-bottom:2px}
  input,select{width:100%;box-sizing:border-box;font-size:16px;padding:8px;border:1px solid #ccc;border-radius:8px}
  button{width:100%;padding:13px;font-size:17px;border:0;border-radius:10px;background:#0a7cff;color:#fff;margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:6px 4px;text-align:right;border-bottom:1px solid #eee}
  th{background:#f0f2f5}
  tr.cut{background:#ffe9e9;font-weight:bold}
  tr.re{background:#e6f2ff}
  .big{font-size:16px;font-weight:bold}
  .neg{color:#d32f2f}.pos{color:#2e7d32}
  .kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:14px}
  .warn{background:#fff3cd;padding:10px;border-radius:8px;font-size:14px}
  .hint{font-size:11px;color:#888;margin-top:4px}
</style>
</head>
<body>

<div class="card">
  <div class="grid">
    <div class="sec">ชุดแรก (Grid)</div>
    <div><label>ฝั่ง</label>
      <select id="side"><option>BUY</option><option>SELL</option></select></div>
    <div><label>ราคาไม้ที่ 1</label><input id="entry" type="number" step="0.01" value="3743.65"></div>
    <div><label>ระยะห่างต่อไม้ (USD)</label><input id="step" type="number" step="0.01" value="4"></div>
    <div><label>Leverage 1:</label><input id="lev" type="number" value="200"></div>
    <div class="full"><label>Lot ตามตาราง (คั่นด้วย ,)</label>
      <input id="lots" value="0.01,0.02,0.03,0.05,0.07,0.10,0.15,0.22,0.33,0.50,0.75,1.00,1.50"></div>
    <div class="full"><label>ปิดชุดแรกที่ไม้</label><input id="cut" type="number" value="5"></div>

    <div class="sec">จุดกลับตัว → เข้าใหม่ 3 ไม้</div>
    <div><label>ราคาจุดกลับตัว (ต่ำสุด/สูงสุด)</label>
      <input id="low" type="number" step="0.01" value="3694.00"></div>
    <div><label>SL เลยจุดกลับตัว (USD)</label>
      <input id="slBuf" type="number" step="0.01" value="2"></div>
    <div class="full"><label>สัดส่วนงบเสี่ยง 3 ไม้ (คั่นด้วย ,)</label>
      <input id="split" value="1,1,1">
      <div class="hint">1,1,1 = ทุกไม้เสี่ยงเท่ากัน · 44,32,24 = ให้น้ำหนักไม้แรกมากกว่า</div></div>

    <div class="sec">เงินและเป้าหมาย</div>
    <div><label>ขาดทุนสูงสุด/วัน</label><input id="maxLoss" type="number" value="200"></div>
    <div><label>เผื่อค่าใช้จ่าย</label><input id="buf" type="number" value="16"></div>
    <div class="full"><label>เป้ากำไรสุทธิ (USD)</label><input id="target" type="number" value="100"></div>
  </div>
  <button onclick="calc()">คำนวณ</button>
</div>

<div id="out"></div>

<script>
const $ = id => document.getElementById(id);
const IDS = ["side","entry","step","lev","lots","cut","low","slBuf","split","maxLoss","buf","target"];
const C = 100; // 1 lot = 100 oz
const f = n => n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const cls = n => n < 0 ? "neg" : (n > 0 ? "pos" : "");

IDS.forEach(id => { const v = localStorage.getItem("gc2_"+id); if (v !== null) $(id).value = v; });

function calc(){
  IDS.forEach(id => localStorage.setItem("gc2_"+id, $(id).value));
  const side = $("side").value, d = side === "BUY" ? 1 : -1;
  const entry = +$("entry").value, step = +$("step").value, lev = +$("lev").value;
  const lots = $("lots").value.split(",").map(Number).filter(x => x > 0);
  const cut = +$("cut").value, low = +$("low").value, slBuf = +$("slBuf").value;
  const w = $("split").value.split(",").map(Number).filter(x => x > 0);
  const maxLoss = +$("maxLoss").value, buf = +$("buf").value, target = +$("target").value;
  const out = $("out");

  if (step <= 0 || cut < 1 || lots.length < cut || w.length === 0 || slBuf < 0) {
    out.innerHTML = `<div class="card warn">ตรวจค่าที่กรอก: ระยะห่างต้องมากกว่า 0, Lot ในตารางต้องครบถึงไม้ที่ปิด, ต้องมีสัดส่วนงบ และระยะ SL ต้องไม่ติดลบ</div>`;
    return;
  }

  const price = i => +(entry - d*(i-1)*step).toFixed(2);
  const pnl = (pos, p) => pos.reduce((s,[e,l]) => s + l*C*d*(p - e), 0);

  // หาระดับเข้าใหม่: ระดับ grid แรกที่อยู่ถัดจากจุดกลับตัวไปทางราคาฟื้น แล้วไล่อีก 2 ระดับ
  const k = d*(entry - low)/step;
  const i1 = Math.ceil(k - 1e-9);
  const lvls = [];
  for (let j = 0; j < 3 && i1 - j >= 1; j++) lvls.push(i1 - j);

  // ตารางชุดแรก
  let pos = [], rows = "";
  lots.forEach((l, idx) => {
    const i = idx + 1, p = price(i);
    pos.push([p, l]);
    const tl = pos.reduce((s,x) => s + x[1], 0), fl = pnl(pos, p);
    const c = i === cut ? ' class="cut"' : (lvls.includes(i) ? ' class="re"' : '');
    rows += `<tr${c}><td>${i}</td><td>${f(p)}</td><td>${l.toFixed(2)}</td><td>${tl.toFixed(2)}</td>
      <td class="${cls(fl)}">${f(fl)}</td><td>${f(tl*C*p/lev)}</td></tr>`;
  });
  let html = `<div class="card"><h2>ชุดแรก (${side})</h2>
    <table><tr><th>ไม้</th><th>ราคา</th><th>Lot</th><th>Lots รวม</th><th>ลอยตัว</th><th>Margin</th></tr>${rows}</table>
    <div class="hint">แดง = ไม้ที่ปิดชุดแรก · ฟ้า = ระดับที่เข้าใหม่หลังกลับตัว</div></div>`;

  // ราคากลับตัวก่อนถึงไม้ที่ต้องปิด
  const cutPrice = price(cut);
  if (d*(cutPrice - low) < 0) {
    html += `<div class="card warn">ราคากลับตัวก่อนถึงไม้ ${cut} (${f(cutPrice)}) ชุดแรกยังไม่ถูกปิด จึงไม่ต้องใช้แผนเข้าใหม่</div>`;
    out.innerHTML = html; return;
  }

  const cutPos = lots.slice(0, cut).map((l, idx) => [price(idx+1), l]);
  const cutLoss = +(-pnl(cutPos, cutPrice)).toFixed(2);
  const budget = +(maxLoss - cutLoss - buf).toFixed(2);
  if (budget <= 0) {
    html += `<div class="card warn">งบไม่พอ: ขาดทุนตอนปิด ${f(cutLoss)} + เผื่อค่าใช้จ่าย ${f(buf)} เกินเพดาน ${f(maxLoss)} ควรหยุดวันนี้</div>`;
    out.innerHTML = html; return;
  }

  const sl = +(low - d*slBuf).toFixed(2);
  const ws = lvls.map((_, j) => w[j] ?? w[w.length-1]);
  const sw = ws.reduce((a,b) => a + b, 0);

  const E = lvls.map((lvl, j) => {
    const p = price(lvl);
    const toLow = d*(p - low), dist = d*(p - sl);
    const lot = Math.floor(budget*ws[j]/sw/(C*dist)*100 + 1e-9) / 100;
    return { lvl, p, toLow, dist, lot, risk: lot*C*dist };
  });

  const total = +E.reduce((s,e) => s + e.lot, 0).toFixed(2);
  if (total <= 0) {
    html += `<div class="card warn">Lot เป็น 0 ทั้งหมด — งบน้อยเกินไป หรือ SL ไกลเกินไป</div>`;
    out.innerHTML = html; return;
  }

  let er = "", cum = 0, slRows = "";
  E.forEach((e, n) => {
    const opened = E.slice(0, n+1);
    const atFill = opened.reduce((s,x) => s + x.lot*C*d*(e.p - x.p), 0) - cutLoss;
    cum += e.risk;
    er += `<tr><td>${e.lvl}</td><td>${f(e.p)}</td><td>${f(e.toLow)}</td><td>${f(e.dist)}</td>
      <td class="big">${e.lot.toFixed(2)}</td><td class="neg">${f(-e.risk)}</td><td class="${cls(atFill)}">${f(atFill)}</td></tr>`;
    slRows += `<div class="kv"><span>โดน SL หลังเปิด ${n+1} ไม้ (รวมที่ปิดแล้ว)</span><b class="neg">${f(-(cutLoss + cum))}</b></div>`;
  });

  const base = C * E.reduce((s,e) => s + e.lot*e.p, 0);
  const tp = t => (base + d*t) / (C*total);

  html += `<div class="card"><h2>เข้าใหม่หลังกลับตัวที่ ${f(low)}</h2>
    <table><tr><th>ไม้</th><th>ราคาเข้า</th><th>ห่างจุดกลับตัว</th><th>ห่าง SL</th><th>Lot</th><th>เสี่ยง</th><th>ผลรวมตอนเปิด*</th></tr>${er}
    <tr><th>รวม</th><th></th><th></th><th></th><th>${total.toFixed(2)}</th><th class="neg">${f(-cum)}</th><th></th></tr></table>
    <div class="hint">*รวมขาดทุนที่ปิดชุดแรกไปแล้ว ณ ราคาที่เปิดไม้นั้น</div></div>

  <div class="card"><h2>สรุป</h2>
    <div class="kv"><span>ขาดทุนตอนปิดชุดแรก (ไม้ ${cut})</span><b class="neg">${f(-cutLoss)}</b></div>
    <div class="kv"><span>งบเสี่ยงรอบใหม่</span><b>${f(budget)}</b></div>
    <div class="kv"><span>ใช้จริง / เหลือจากการปัด Lot</span><b>${f(cum)} / ${f(budget - cum)}</b></div>
    <div class="kv"><span>Stop Loss ร่วม</span><b>${f(sl)}</b></div>
    ${slRows}
    <div class="kv"><span>ราคาเท่าทุนทั้งแผน (เปิดครบ)</span><b>${f(tp(cutLoss))}</b></div>
    <div class="kv"><span>ปิดได้กำไร ${f(target)} (ก่อนค่าใช้จ่าย)</span><b class="pos">${f(tp(target + cutLoss))}</b></div>
    <div class="kv"><span>ปิดได้กำไร ${f(target)} (หลังค่าใช้จ่าย)</span><b class="pos">${f(tp(target + cutLoss + buf))}</b></div>
    <div class="kv"><span>ราคาขยับ 1 USD (เปิดครบ)</span><b>${f(total*C)} USD</b></div>
  </div>
  <div class="card warn">เปิดไม้ 2–3 เฉพาะเมื่อราคาฟื้นไปถึงจริง · ห้ามถัวเพิ่มตอนราคาสวน · โดน SL หรือถึงเป้าแล้วหยุดวันนั้น · ยังไม่รวม swap และ SL อาจคลาดเคลื่อนเมื่อราคากระโดด</div>`;

  out.innerHTML = html;
}
calc();
</script>
</body>
</html>
